*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scrollbar-gutter:stable}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,Manrope,-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:104px;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.bud{margin:12px 6px 4px;text-align:left}
.tiles{display:flex;gap:10px;padding:2px 2px 14px}

.op{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0;width:100%;border:0;background:var(--soft);text-align:left;border-radius:18px;min-height:60px;box-shadow:0 1px 2px rgba(60,40,30,.05)}
.ic{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 40px;overflow:hidden;color:var(--ink)}
.ic img{width:100%;height:100%;object-fit:cover}
.op .m{flex:1;min-width:0}.op .m>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .r{flex:0 0 auto;text-align:right;white-space:nowrap;font-size:clamp(13px,3.9vw,16px)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:14px 0 2px;font-weight:600}
.act{display:flex;gap:10px}.act button{flex:1;padding:12px 8px;font-weight:700;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px}
.act .main{flex:2}.act .sq{flex:0 0 54px;padding:0}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,22,18,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(30px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.modal.show .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 14px}
label{display:block;margin:14px 0 6px;font-size:13px;color:var(--mute)}
.hide{display:none}
.banner{background:var(--accsoft);color:var(--ink);border-radius:20px;padding:16px;margin:16px 0;font-weight:600;border:1px solid var(--line)}
.banner button{margin-top:10px;background:var(--acc);color:var(--accink);border-color:var(--acc)}
.mini{display:flex;gap:8px;flex-wrap:wrap}.mini>div{flex:1 1 76px;min-width:76px}.mini label{margin:0 0 4px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini input{padding:9px 6px;text-align:center}
.legend .li{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:15px;width:100%;border:0;background:none;text-align:left;border-radius:12px;min-height:36px}.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.dsel{display:flex;gap:6px}.dsel select{padding:10px 6px}.dsel select:first-child{flex:0 0 66px}.dsel select:last-child{flex:0 0 88px}
.emsq{width:54px;height:54px;font-size:26px;padding:0;border-radius:16px;flex:0 0 54px;overflow:hidden;background:var(--soft);border-color:transparent}
.ep{display:none;flex-wrap:wrap;gap:2px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:8px;max-height:170px;overflow:auto}.ep.show{display:flex}.ep button{border:0;font-size:24px;padding:4px 6px;background:none;min-height:0}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px dashed var(--line2);border-radius:16px;background:var(--soft);font-weight:600;cursor:pointer;margin-top:10px;color:var(--ink)}
.upl input{display:none}
.cover{width:100%;aspect-ratio:16/9;border-radius:20px;background:var(--soft) center/cover no-repeat;border:1.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--mute);cursor:pointer;overflow:hidden;margin:0}
.cover.has{border-style:solid;border-color:transparent}
.mh{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-top:2px solid var(--line2);padding-top:16px;margin-top:30px}

.dcard{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:20px;padding:10px;margin:10px 0}
.dcard select{flex:1;min-width:0;font-weight:650;font-size:16px;border-color:transparent}
.pctbox{display:flex;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:0 12px;flex:0 0 auto}

.pctbox b{font-size:16px;color:var(--acct)}
.stk{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line);margin:8px 0 12px}.stk i{display:block;height:100%}
.gimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;display:block;margin-bottom:12px}
.stat{flex:1;text-align:center;padding:14px 8px;border-radius:18px;border:1px solid}.stat b{display:block;font-size:clamp(15px,4.8vw,20px);margin-top:2px;font-weight:700;white-space:nowrap}
.stat.sp{background:var(--redbg);border-color:var(--redln)}.stat.in{background:var(--grnbg);border-color:var(--grnln)}
.amt{font-size:32px;font-weight:700;padding:14px 18px;text-align:left}
.insb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-top:10px;border-radius:18px;background:var(--soft);border:0;font-size:15px;min-height:56px}
.insb .i{flex:0 0 36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--acct)}
.insb .t{flex:1;min-width:0}.insb .c{color:var(--acct);display:flex}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.cal div.h{text-align:center;font-size:12px;color:var(--mute);font-weight:600}

.cal button.td{box-shadow:inset 0 0 0 2px var(--acc);font-weight:700}.cal .dots{display:block;font-size:10px;line-height:1;margin-top:2px;height:10px}
.qline{display:flex;gap:8px;margin:12px 0 4px}.qline button{flex:0 0 52px;padding:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0 14px;color:var(--mute);text-align:center;font-size:14px}.empty .svg{opacity:.55}
details.more{padding:0}details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:650;padding:16px 18px;min-height:56px}
details.more>summary::-webkit-details-marker{display:none}details.more>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .25s;margin-right:4px}
details.more[open]>summary::after{transform:rotate(-135deg)}details.more .inner{padding:0 18px 18px}
.subh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:6px;min-height:0;font-size:13px;flex:1;border-radius:18px}
.sw i{width:48px;height:48px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06);transition:box-shadow .25s}
.sw.on i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--acc)}.sw.on span{font-weight:700;color:var(--acct)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:8;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{display:flex;animation:up .25s cubic-bezier(.2,.8,.2,1)}#toast button{background:none;border:0;color:var(--acc);font-weight:700;padding:4px 8px;white-space:nowrap;min-height:0}
#lock{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:30;display:none;align-items:center;justify-content:center}#lock.show{display:flex}
.lk{text-align:center}.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:20px}.keys button{height:66px;font-size:22px;border-radius:50%;padding:0;background:var(--soft);border-color:transparent}.dots2{font-size:26px;letter-spacing:6px;margin:14px 0}
#err{background:#B3261E;color:#fff;padding:8px;font-size:13px;display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(36px);opacity:.5}to{transform:none;opacity:1}}
@keyframes ringIn{from{stroke-dasharray:0 100}}
svg circle[stroke-dasharray]{animation:ringIn .9s cubic-bezier(.2,.8,.2,1)}
#app.slide-l{animation:slideL .34s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}#app.slide-r{animation:slideR .34s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}#app.fade{animation:fadeA .24s ease-out}
